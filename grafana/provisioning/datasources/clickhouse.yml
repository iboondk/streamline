apiVersion: 1

# Values come from the container environment (see .env.example and docker-compose.yml).
# No credentials are stored in this file.
datasources:
  - name: ClickHouse
    uid: streamline-ch
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: streamline
      username: ${CLICKHOUSE_USER}
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
